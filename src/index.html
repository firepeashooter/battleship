<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Battleship</title>
</head>

<body>


	<div class="header">

		<div class="left">

			<h2>Battleship</h2>

		</div>
		<div class="right">

		</div>

	</div>



	<div class="main">



	</div>

	<dialog id="start--game" class="dialog">

		<div class="top">
			<h2>Start Game</h2>
		</div>

		<div class="bottom">
			<form id="start--game--form" action="submit">

				<div class="start--form--top">

					<div class="input">

						<div class="text--input">
							<label for="player1">Player 1:</label>
							<input type="text" name="player1">
						</div>
						<div class="check--input hide">
							<label for="bot">Bot?</label>
							<input type="checkbox" name="bot">
						</div>

					</div>

					<div class="input">
						<div class="text--input">
							<label for="player2">Player 2:</label>
							<input type="text" name="player2">
						</div>
						<div class="check--input">
							<label for="bot">Bot?</label>
							<input type="checkbox" name="bot">
						</div>
					</div>

				</div>


				<div class="start--form--bottom">
					<button type="submit" class="start--game--button">Start Game</button>
				</div>



			</form>
		</div>





	</dialog>

	<dialog id="passer" class="dialog">

		<h2>Pass The Computer to: </h2>
		<h2 id="player--name"> </h2>

	</dialog>




	<div class="footer">

		<h4>Copyright @ FirePea</h6>

	</div>




</body>

</html>
