<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Battleship</title>
</head>

<body>


	<div class="header">

		<div class="left">

			<h2>Battleship</h2>

		</div>
		<div class="right">

		</div>

	</div>



	<div class="main">



	</div>

	<dialog id="start--game" class="dialog">

		<div class="top">
			<h2>Start Game</h2>
		</div>

		<div class="bottom">
			<form id="start--game--form" action="submit">

				<label for="player1">Player 1:</label>
				<input type="text" name="player1">
				<label for="player2">Player 2:</label>
				<input type="text" name="player2">
				<button type="submit">Start Game</button>

			</form>
		</div>





	</dialog>

	<dialog id="passer" class="dialog">

		<h2>Pass The Computer to: </h2>
		<h2 id="player--name"> </h2>

	</dialog>




	<div class="footer">

		<h4>Copyright @ FirePea</h6>

	</div>




</body>

</html>
